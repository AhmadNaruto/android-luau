name: Run Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Host JNI Library
        run: |
          mkdir -p host-build && cd host-build
          cmake ../luau-android/src/main/cpp
          make -j$(nproc)

      - name: Run Unit Tests
        env:
          LUAU_ANDROID_TEST_LIB: ${{ github.workspace }}/host-build/libluau.so
        run: ./gradlew test
