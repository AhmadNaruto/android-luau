name: Build Debug Artifacts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Compile Debug Target
        run: ./gradlew assembleDebug

      - name: Upload Library AAR
        uses: actions/upload-artifact@v7
        with:
          name: luau-android-debug-aar
          path: luau-android/build/outputs/aar/luau-android-debug.aar

      - name: Upload Sample APK
        uses: actions/upload-artifact@v7
        with:
          name: sample-app-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
